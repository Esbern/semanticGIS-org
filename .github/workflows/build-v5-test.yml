name: Test build (Quartz 5)

# Builds the site with Quartz 5 from the vault, adds the Quartz 4 addresses (legacy-urls.mjs)
# and uploads the result as an artifact. It does NOT deploy: semanticgis.org stays on the
# Quartz 4 build from main until the migration is switched over.

on:
  push:
    branches:
      - quartz-v5
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout vault content (private work-projects, 40 SemanticGIS only)
        uses: actions/checkout@v6
        with:
          repository: Esbern/work-projects
          token: ${{ secrets.WORK_PROJECTS_PAT }}
          path: _vault-src
          sparse-checkout: |
            40 SemanticGIS

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Sync vault content into Quartz content/
        run: |
          mkdir -p content
          rsync -a --delete --exclude="Data/templates/" "_vault-src/40 SemanticGIS/" content/
          rm -rf _vault-src

      - name: Install dependencies and Quartz plugins
        run: |
          npm ci
          npx quartz plugin install

      - name: Build Quartz
        run: npx quartz build

      - name: Keep the Quartz 4 addresses working
        run: node scripts/legacy-urls.mjs public

      - name: Upload the built site
        uses: actions/upload-artifact@v5
        with:
          name: site-v5
          path: public
          retention-days: 5
