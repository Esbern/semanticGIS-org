name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main # Corrected to our branch name
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all history for git info

      # --- New steps: pull just the public-facing folder out of the ---
      # --- private work-projects repo, nothing else in that vault.  ---
      - name: Checkout vault content (private work-projects, 40 SemanticGIS only)
        uses: actions/checkout@v6
        with:
          repository: Esbern/work-projects
          token: ${{ secrets.WORK_PROJECTS_PAT }}
          path: _vault-src
          sparse-checkout: |
            40 SemanticGIS

      - name: Sync vault content into Quartz content/
        run: |
          mkdir -p content
          rsync -a --delete --exclude="Data/templates/" "_vault-src/40 SemanticGIS/" content/
          rm -rf _vault-src
      # --- End of new steps. ---

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Build Quartz
        run: node quartz/bootstrap-cli.mjs build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5